# Postgres cho môi trường local:  npm run db:up   (dừng: npm run db:down)
# Dữ liệu lưu trong volume "buoc-pg", không mất khi dừng container.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: buoc
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - buoc-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d buoc"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  buoc-pg:
